name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

# Repository variables, not secrets: both values end up in the public bundle.
env:
  NEXT_PUBLIC_CAL_LINK: ${{ vars.NEXT_PUBLIC_CAL_LINK }}
  NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Reads the version from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Vercel builds on its side, so the public variables travel with the deployment.
      # Unset ones are skipped, which leaves any value set in the Vercel project in place.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          args=(--yes --token "$VERCEL_TOKEN")

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            args+=(--prod)
          else
            args+=(--env STAGING=true)
          fi

          for name in NEXT_PUBLIC_CAL_LINK NEXT_PUBLIC_GA_ID; do
            if [ -n "${!name}" ]; then
              args+=(--build-env "$name=${!name}")
            fi
          done

          npx --yes vercel "${args[@]}"
